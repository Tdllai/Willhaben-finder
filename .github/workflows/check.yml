name: willhaben-check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: willhaben
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Load data
        run: |
          rm -rf data
          if git fetch -q --depth 1 origin data; then
            git checkout FETCH_HEAD -- data || true
          fi

      - name: Check
        run: python3 willhaben_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Save data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d data ] || exit 0
          mkdir -p /tmp/out && cp -r data /tmp/out/
          cd /tmp/out
          git init -q -b data
          git add data
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm data
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
